- name: Create Hashicorp Repository
  copy:
    src: "files/hashicorp.repo"
    dest: "/etc/yum.repos.d/hashicorp.repo"
    owner: root
    group: root
    mode: 0644
  tags:
    - packages

- name: Install the 'Virtualization' package group
  ansible.builtin.dnf:
    name: '@virtualization'
    state: present
  tags:
    - packages

- name: Install DNF Package List
  ansible.builtin.dnf:
    name: "{{ item }}"
    state: present
  with_items: "{{ dnf_packages }}"
  tags:
    - packages
